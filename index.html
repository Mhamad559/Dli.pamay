<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="appTitle">دڵی پەمەیی</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="دڵی پەمەیی" id="metaAppTitle">
  <meta name="application-name" content="دڵی پەمەیی">
  <meta name="theme-color" content="#050205" id="metaThemeColor">

  <link rel="manifest" id="manifestPlaceholder">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050205;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
  // ==========================================
  // 🎨 ڕێکخستنی شێواز و ڕەنگەکان (TEMPLATES)
  // ==========================================
  // دەتوانیت یەکێک لەم تێمانە هەڵبژێریت یان ڕەنگی خۆت دابنێی:
  // "pink" , "blue" , "gold" , "purple" , "green" , "red"
  const CURRENT_TEMPLATE = "pink"; 

  const THEMES = {
    pink: {
      name: "دڵی پەمەیی",
      bg: "#050205",
      shades: ["#ec4899", "#f43f5e", "#f472b6", "#fb7185", "#fbcfe8", "#e11d48", "#ff66c4"],
      glow: "#ec4899"
    },
    blue: {
      name: "دڵی شین",
      bg: "#020308",
      shades: ["#3b82f6", "#60a5fa", "#93c5fd", "#2563eb", "#1d4ed8", "#93c5fd", "#67e8f9"],
      glow: "#3b82f6"
    },
    gold: {
      name: "دڵی زێڕین",
      bg: "#050502",
      shades: ["#f59e0b", "#fbbf24", "#fcd34d", "#d97706", "#b45309", "#fef3c7", "#fde047"],
      glow: "#f59e0b"
    },
    purple: {
      name: "دڵی مۆر",
      bg: "#040206",
      shades: ["#a855f7", "#c084fc", "#e879f9", "#9333ea", "#7e22ce", "#f3e8ff", "#d8b4fe"],
      glow: "#a855f7"
    },
    green: {
      name: "دڵی سەوز",
      bg: "#020503",
      shades: ["#10b981", "#34d399", "#6ee7b7", "#059669", "#047857", "#a7f3d0", "#6ee7b7"],
      glow: "#10b981"
    },
    red: {
      name: "دڵی سوور",
      bg: "#050202",
      shades: ["#ef4444", "#f87171", "#dc2626", "#b91c1c", "#fca5a5", "#fee2e2", "#ef4444"],
      glow: "#ef4444"
    }
  };

  const theme = THEMES[CURRENT_TEMPLATE] || THEMES.pink;

  // نوێکردنەوەی ناوی پەڕە و ڕەنگەکان لە HTMLدا
  document.getElementById("appTitle").innerText = theme.name;
  document.getElementById("metaAppTitle").setAttribute("content", theme.name);
  document.getElementById("metaThemeColor").setAttribute("content", theme.bg);
  document.body.style.backgroundColor = theme.bg;

  // دروستکردنی ئایکۆنی SVG بەپێی ئەو ڕەنگەی هەڵبژێردراوە
  const encodedGlow = encodeURIComponent(theme.glow);
  const encodedMain = encodeURIComponent(theme.shades[0]);
  const encodedBg = encodeURIComponent(theme.bg);
  
  const iconSVG = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='${encodedBg}'/><path d='M50 82 C20 60 10 42 10 28 A18 18 0 0 1 44 18 L50 25 L56 18 A18 18 0 0 1 90 28 C90 42 80 60 50 82 Z' fill='${encodedMain}' filter='drop-shadow(0 0 8px ${encodedGlow})'/></svg>`;
  
  const linkIcon = document.createElement('link');
  linkIcon.rel = 'icon';
  linkIcon.type = 'image/svg+xml';
  linkIcon.href = iconSVG;
  document.head.appendChild(linkIcon);

  const linkAppleIcon = document.createElement('link');
  linkAppleIcon.rel = 'apple-touch-icon';
  linkAppleIcon.href = iconSVG;
  document.head.appendChild(linkAppleIcon);

  // دروستکردنی مانێفێست بۆ ئاپەکە
  const manifestData = {
    "name": theme.name,
    "short_name": theme.name,
    "start_url": ".",
    "display": "standalone",
    "background_color": theme.bg,
    "theme_color": theme.bg,
    "icons": [
      {
        "src": iconSVG,
        "sizes": "512x512",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      }
    ]
  };
  const stringManifest = JSON.stringify(manifestData);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  document.getElementById('manifestPlaceholder').setAttribute('href', manifestURL);

  // ڕێگری لە زوومکردن
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  const canvas = document.getElementById("heartCanvas");
  const ctx = canvas.getContext("2d");

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  class Particle {
    constructor(x, y, isBurst = false) {
      this.init(x, y, isBurst);
    }

    init(x, y, isBurst = false) {
      this.isBurst = isBurst;
      this.color = theme.shades[(Math.random() * theme.shades.length) | 0];
      
      if (!isBurst) {
        this.t = Math.random() * Math.PI * 2;
        const scale = 11 + Math.sin(Date.now() * 0.003) * 1.2;
        
        const hx = 16 * Math.pow(Math.sin(this.t), 3);
        const hy = -(13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t));

        this.x = width / 2 + hx * scale + (Math.random() - 0.5) * 12;
        this.y = height / 2 + hy * scale + (Math.random() - 0.5) * 12;
        
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8 - 0.3;
        this.size = Math.random() * 2 + 1;
        this.maxLife = Math.random() * 50 + 25;
        this.life = Math.random() * this.maxLife;
      } else {
        this.x = x + (Math.random() - 0.5) * 8;
        this.y = y + (Math.random() - 0.5) * 8;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 3 + 1;
        this.maxLife = Math.random() * 30 + 15;
        this.life = this.maxLife;
      }
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life--;
    }

    draw() {
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const floatParticles = [];
  const burstParticles = [];
  const FLOAT_COUNT = 180;

  for (let i = 0; i < FLOAT_COUNT; i++) {
    floatParticles.push(new Particle(0, 0, false));
  }

  function triggerBurst(x, y, count = 10) {
    for (let i = 0; i < count; i++) {
      burstParticles.push(new Particle(x, y, true));
    }
  }

  window.addEventListener("touchstart", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.touches.length; i++) {
      triggerBurst(e.touches[i].clientX, e.touches[i].clientY, 20);
    }
  }, { passive: false });

  window.addEventListener("touchmove", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.touches.length; i++) {
      triggerBurst(e.touches[i].clientX, e.touches[i].clientY, 6);
    }
  }, { passive: false });

  window.addEventListener("mousemove", (e) => {
    if (e.buttons === 1) triggerBurst(e.clientX, e.clientY, 6);
  });

  window.addEventListener("mousedown", (e) => {
    triggerBurst(e.clientX, e.clientY, 20);
  });

  function animate() {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = theme.bg + "33"; // گۆڕینی پاشماوەی ڕەنگەکە بەپێی تێما
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < floatParticles.length; i++) {
      let p = floatParticles[i];
      p.update();
      p.draw();
      if (p.life <= 0) p.init(0, 0, false);
    }

    for (let i = burstParticles.length - 1; i >= 0; i--) {
      let p = burstParticles[i];
      p.update();
      p.draw();
      if (p.life <= 0) burstParticles.splice(i, 1);
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
