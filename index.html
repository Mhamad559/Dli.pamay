<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دڵی پەمەیی</title>

  <!-- PWA & Mobile App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="دڵی پەمەیی">
  <meta name="application-name" content="دڵی پەمەیی">
  <meta name="theme-color" content="#050205">

  <!-- SVG Icon (ئایکۆنی درەوشاوەی دڵی پەمەیی بۆ ئاپەکە) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050205'/><path d='M50 82 C20 60 10 42 10 28 A18 18 0 0 1 44 18 L50 25 L56 18 A18 18 0 0 1 90 28 C90 42 80 60 50 82 Z' fill='%23f43f5e' filter='drop-shadow(0 0 8px %23ec4899)'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050205'/><path d='M50 82 C20 60 10 42 10 28 A18 18 0 0 1 44 18 L50 25 L56 18 A18 18 0 0 1 90 28 C90 42 80 60 50 82 Z' fill='%23f43f5e' filter='drop-shadow(0 0 8px %23ec4899)'/></svg>">

  <!-- Web Manifest dynamic setup -->
  <link rel="manifest" id="manifestPlaceholder">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050205;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
  // دروستکردنی مانێفێست بۆ ناساندنی ناو و ئایکۆنی ئەپەکە
  const iconSVG = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050205'/><path d='M50 82 C20 60 10 42 10 28 A18 18 0 0 1 44 18 L50 25 L56 18 A18 18 0 0 1 90 28 C90 42 80 60 50 82 Z' fill='%23f43f5e' filter='drop-shadow(0 0 8px %23ec4899)'/></svg>`;
  const manifestData = {
    "name": "دڵی پەمەیی",
    "short_name": "دڵی پەمەیی",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#050205",
    "theme_color": "#050205",
    "icons": [
      {
        "src": iconSVG,
        "sizes": "512x512",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      }
    ]
  };
  const stringManifest = JSON.stringify(manifestData);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  document.getElementById('manifestPlaceholder').setAttribute('href', manifestURL);

  // ڕێگری لە زوومکردن
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  const canvas = document.getElementById("heartCanvas");
  const ctx = canvas.getContext("2d");

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const PINK_SHADES = [
    "#ec4899", "#f43f5e", "#f472b6", 
    "#fb7185", "#fbcfe8", "#e11d48", "#ff66c4"
  ];

  class Particle {
    constructor(x, y, isBurst = false) {
      this.init(x, y, isBurst);
    }

    init(x, y, isBurst = false) {
      this.isBurst = isBurst;
      this.color = PINK_SHADES[(Math.random() * PINK_SHADES.length) | 0];
      
      if (!isBurst) {
        this.t = Math.random() * Math.PI * 2;
        const scale = 11 + Math.sin(Date.now() * 0.003) * 1.2;
        
        const hx = 16 * Math.pow(Math.sin(this.t), 3);
        const hy = -(13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t));

        this.x = width / 2 + hx * scale + (Math.random() - 0.5) * 12;
        this.y = height / 2 + hy * scale + (Math.random() - 0.5) * 12;
        
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8 - 0.3;
        this.size = Math.random() * 2 + 1;
        this.maxLife = Math.random() * 50 + 25;
        this.life = Math.random() * this.maxLife;
      } else {
        this.x = x + (Math.random() - 0.5) * 8;
        this.y = y + (Math.random() - 0.5) * 8;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 3 + 1;
        this.maxLife = Math.random() * 30 + 15;
        this.life = this.maxLife;
      }
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life--;
    }

    draw() {
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const floatParticles = [];
  const burstParticles = [];
  const FLOAT_COUNT = 180;

  for (let i = 0; i < FLOAT_COUNT; i++) {
    floatParticles.push(new Particle(0, 0, false));
  }

  function triggerBurst(x, y, count = 10) {
    for (let i = 0; i < count; i++) {
      burstParticles.push(new Particle(x, y, true));
    }
  }

  window.addEventListener("touchstart", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.touches.length; i++) {
      triggerBurst(e.touches[i].clientX, e.touches[i].clientY, 20);
    }
  }, { passive: false });

  window.addEventListener("touchmove", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.touches.length; i++) {
      triggerBurst(e.touches[i].clientX, e.touches[i].clientY, 6);
    }
  }, { passive: false });

  window.addEventListener("mousemove", (e) => {
    if (e.buttons === 1) triggerBurst(e.clientX, e.clientY, 6);
  });

  window.addEventListener("mousedown", (e) => {
    triggerBurst(e.clientX, e.clientY, 20);
  });

  function animate() {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(5, 2, 5, 0.2)";
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < floatParticles.length; i++) {
      let p = floatParticles[i];
      p.update();
      p.draw();
      if (p.life <= 0) p.init(0, 0, false);
    }

    for (let i = burstParticles.length - 1; i >= 0; i--) {
      let p = burstParticles[i];
      p.update();
      p.draw();
      if (p.life <= 0) burstParticles.splice(i, 1);
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
